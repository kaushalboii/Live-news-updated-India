name: Live News Ingestion & Deploy

on:
  schedule:
    - cron: "12,42 * * * *"   # runs every 30 min, off the peak hour
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset:
        description: "Discard cached pipeline state and perform full 48-hour backfill"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: live-news-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pipeline cache: preserves bookmark and clusters between runs
      - name: Restore GDELT state cache
        if: ${{ !inputs.reset }}
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: gdelt-news-state-${{ github.run_id }}
          restore-keys: gdelt-news-state-

      - name: Ingest live India news from GDELT
        run: node scripts/fetch-gdelt.mjs

      - name: Save GDELT state cache
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: gdelt-news-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build production site
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url || 'https://kaushalboii.github.io/Live-news-updated-India/' }}
        run: node scripts/build-site.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Optional Vercel production deployment if VERCEL_TOKEN secret is present
      - name: Deploy to Vercel (optional)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "No VERCEL_TOKEN secret configured; skipping Vercel deploy"; exit 0; fi
          npx --yes vercel@latest deploy _site --prod --yes --token "$VERCEL_TOKEN"

      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" && echo "Schedule kept active"
          fi
