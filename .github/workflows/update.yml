name: Update and deploy

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the hour
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset:
        description: "Discard cached state and re-fetch the full window"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore pipeline state
        if: ${{ !inputs.reset }}
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: gdelt-news-state-${{ github.run_id }}
          restore-keys: gdelt-news-state-

      - name: Fetch news from GDELT
        run: node scripts/fetch-gdelt.mjs

      - name: Save pipeline state
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: gdelt-news-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url || 'https://kaushalboii.github.io/Live-news-updated-India/' }}
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

      - name: Deploy to GitHub Pages (Actions mode)
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to gh-pages branch (Branch mode)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

      - name: Deploy to Vercel (optional)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "No VERCEL_TOKEN secret; skipping Vercel"; exit 0; fi
          npx --yes vercel@latest deploy _site --prod --yes --token "$VERCEL_TOKEN"

      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" && echo "Schedule kept alive"
          fi
