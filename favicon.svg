<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Broadcast radio waves -->
  <path d="M14,24 A22,22 0 0,1 50,24" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M19,30 A16,16 0 0,1 45,30" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M24,36 A10,10 0 0,1 40,36" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Live Signal Beacon -->
  <circle cx="32" cy="42" r="14" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.4"/>
  <circle cx="32" cy="42" r="8" fill="#EF4444"/>
  <circle cx="32" cy="42" r="3.5" fill="#FFFFFF"/>
</svg>
